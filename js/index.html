<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sword Slasher RPG: Shadow Link's Awakening - Vanilla JS Parity Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 12px;
      text-align: center;
      background: #000;
      border-bottom: 2px solid #DE2626;
      width: 100%;
    }
    h1 {
      color: #DE2626;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .subtitle {
      color: #aaaaaa;
      font-size: 11px;
      margin-top: 4px;
    }
    #viewport-container {
      position: relative;
      margin: 16px;
      border: 3px solid #DE2626;
      box-shadow: 0 0 25px rgba(222, 38, 38, 0.4);
      background: #050505;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    #controls-bar {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
    .badge {
      background: #DE2626;
      color: #FFF;
      padding: 2px 6px;
      font-weight: bold;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sword Slasher RPG: Shadow Link's Awakening</h1>
    <div class="subtitle">Vanilla JavaScript Parity Engine Mirror · Powered by <span class="badge">BEJSON 105</span></div>
  </header>

  <div id="viewport-container" style="width: 448px; height: 448px; max-width: 90vw; max-height: 90vw;">
    <canvas id="gameCanvas" width="448" height="448"></canvas>
  </div>

  <div id="controls-bar">
    Controls: WASD / Arrow Keys = Move | J = Slash | K = Spin | Shift = Dash | X = Map | I = Inventory
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
