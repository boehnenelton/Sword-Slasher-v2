<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated;shape-rendering:crispEdges;">
  <rect width="128" height="128" fill="none"/>

  <!-- ==================== ROW 0: BOW DOWN ==================== -->
  <!-- Col 0: Equip & Draw Bow -->
  <g transform="translate(0, 0)">
    <polygon points="12,4 20,4 22,8 10,8" fill="#000000"/>
    <rect x="8" y="8" width="16" height="5" fill="#000000"/>
    <rect x="10" y="13" width="12" height="5" fill="#14141a"/>
    <rect x="12" y="14" width="2" height="2" fill="#DE2626"/>
    <rect x="18" y="14" width="2" height="2" fill="#DE2626"/>
    <rect x="9" y="18" width="14" height="8" fill="#000000"/>
    <rect x="9" y="21" width="14" height="2" fill="#DE2626"/>
    <!-- Recurve bow held in left hand -->
    <path d="M5,12 Q3,20 5,28" stroke="#DE2626" stroke-width="2" fill="none"/>
    <path d="M5,12 L5,28" stroke="#FFFFFF" stroke-width="0.8" fill="none"/>
    <rect x="10" y="26" width="4" height="4" fill="#000000"/>
    <rect x="18" y="26" width="4" height="4" fill="#000000"/>
  </g>

  <!-- Col 1: Nock Arrow Down -->
  <g transform="translate(32, 0)">
    <polygon points="12,4 20,4 22,8 10,8" fill="#000000"/>
    <rect x="8" y="8" width="16" height="5" fill="#000000"/>
    <rect x="10" y="13" width="12" height="5" fill="#14141a"/>
    <rect x="12" y="14" width="2" height="2" fill="#DE2626"/>
    <rect x="18" y="14" width="2" height="2" fill="#DE2626"/>
    <rect x="9" y="18" width="14" height="8" fill="#000000"/>
    <!-- Bow horizontal forward -->
    <path d="M8,22 Q16,20 24,22" stroke="#DE2626" stroke-width="2" fill="none"/>
    <line x1="8" y1="22" x2="24" y2="22" stroke="#FFFFFF" stroke-width="0.8"/>
    <!-- Arrow nocked pointing down -->
    <line x1="16" y1="18" x2="16" y2="27" stroke="#000000" stroke-width="1.5"/>
    <polygon points="16,29 14,26 18,26" fill="#FFFFFF"/>
    <rect x="10" y="26" width="4" height="4" fill="#000000"/>
    <rect x="18" y="26" width="4" height="4" fill="#000000"/>
  </g>

  <!-- Col 2: Full Draw Tension Down -->
  <g transform="translate(64, 0)">
    <polygon points="12,5 20,5 22,9 10,9" fill="#000000"/>
    <rect x="8" y="9" width="16" height="5" fill="#000000"/>
    <rect x="10" y="14" width="12" height="5" fill="#14141a"/>
    <rect x="12" y="15" width="2" height="2" fill="#DE2626"/>
    <rect x="18" y="15" width="2" height="2" fill="#DE2626"/>
    <rect x="9" y="19" width="14" height="8" fill="#000000"/>
    <!-- Bow curved under deep tension -->
    <path d="M7,24 Q16,21 25,24" stroke="#DE2626" stroke-width="2.5" fill="none"/>
    <!-- String pulled taut back to chest -->
    <polyline points="7,24 16,16 25,24" stroke="#FFFFFF" stroke-width="1" fill="none"/>
    <!-- Arrow fully drawn with glowing crimson head -->
    <line x1="16" y1="16" x2="16" y2="29" stroke="#000000" stroke-width="1.5"/>
    <polygon points="16,31 13,27 19,27" fill="#FFFFFF"/>
    <circle cx="16" cy="30" r="1.5" fill="#DE2626"/>
    <rect x="9" y="26" width="5" height="4" fill="#000000"/>
    <rect x="18" y="26" width="5" height="4" fill="#000000"/>
  </g>

  <!-- Col 3: Release / Arrow Loosed Down -->
  <g transform="translate(96, 0)">
    <polygon points="12,4 20,4 22,8 10,8" fill="#000000"/>
    <rect x="8" y="8" width="16" height="5" fill="#000000"/>
    <rect x="10" y="13" width="12" height="5" fill="#14141a"/>
    <rect x="12" y="14" width="2" height="2" fill="#DE2626"/>
    <rect x="18" y="14" width="2" height="2" fill="#DE2626"/>
    <rect x="9" y="18" width="14" height="8" fill="#000000"/>
    <!-- String snapped straight forward -->
    <path d="M8,24 Q16,23 24,24" stroke="#DE2626" stroke-width="2" fill="none"/>
    <line x1="8" y1="24" x2="24" y2="24" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Muzzle flash pulse ring -->
    <circle cx="16" cy="28" r="3" stroke="#DE2626" stroke-width="1" fill="none"/>
    <circle cx="16" cy="28" r="1" fill="#FFFFFF"/>
    <rect x="10" y="26" width="4" height="4" fill="#000000"/>
    <rect x="18" y="26" width="4" height="4" fill="#000000"/>
  </g>

  <!-- ==================== ROW 1: BOW UP ==================== -->
  <!-- Col 0: Equip Up -->
  <g transform="translate(0, 32)">
    <polygon points="12,4 20,4 22,8 10,8" fill="#000000"/>
    <polygon points="14,8 18,8 20,16 12,16" fill="#000000"/>
    <rect x="8" y="16" width="16" height="9" fill="#000000"/>
    <!-- Bow slung at back -->
    <path d="M6,10 Q16,14 26,10" stroke="#DE2626" stroke-width="2" fill="none"/>
    <rect x="10" y="25" width="4" height="5" fill="#000000"/>
    <rect x="18" y="25" width="4" height="5" fill="#000000"/>
  </g>

  <!-- Col 1: Nock Up -->
  <g transform="translate(32, 32)">
    <polygon points="12,4 20,4 22,8 10,8" fill="#000000"/>
    <polygon points="14,8 18,8 20,16 12,16" fill="#000000"/>
    <rect x="8" y="16" width="16" height="9" fill="#000000"/>
    <path d="M8,10 Q16,12 24,10" stroke="#DE2626" stroke-width="2" fill="none"/>
    <line x1="16" y1="14" x2="16" y2="6" stroke="#000000" stroke-width="1.5"/>
    <polygon points="16,4 14,7 18,7" fill="#FFFFFF"/>
    <rect x="10" y="25" width="4" height="5" fill="#000000"/>
    <rect x="18" y="25" width="4" height="5" fill="#000000"/>
  </g>

  <!-- Col 2: Full Draw Tension Up -->
  <g transform="translate(64, 32)">
    <polygon points="12,5 20,5 22,9 10,9" fill="#000000"/>
    <polygon points="14,9 18,9 20,17 12,17" fill="#000000"/>
    <rect x="8" y="17" width="16" height="8" fill="#000000"/>
    <path d="M7,8 Q16,11 25,8" stroke="#DE2626" stroke-width="2.5" fill="none"/>
    <polyline points="7,8 16,16 25,8" stroke="#FFFFFF" stroke-width="1" fill="none"/>
    <line x1="16" y1="16" x2="16" y2="3" stroke="#000000" stroke-width="1.5"/>
    <polygon points="16,1 13,5 19,5" fill="#FFFFFF"/>
    <circle cx="16" cy="2" r="1.5" fill="#DE2626"/>
    <rect x="10" y="25" width="4" height="5" fill="#000000"/>
    <rect x="18" y="25" width="4" height="5" fill="#000000"/>
  </g>

  <!-- Col 3: Release Up -->
  <g transform="translate(96, 32)">
    <polygon points="12,4 20,4 22,8 10,8" fill="#000000"/>
    <polygon points="14,8 18,8 20,16 12,16" fill="#000000"/>
    <rect x="8" y="16" width="16" height="9" fill="#000000"/>
    <path d="M8,8 Q16,9 24,8" stroke="#DE2626" stroke-width="2" fill="none"/>
    <line x1="8" y1="8" x2="24" y2="8" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="16" cy="4" r="3" stroke="#DE2626" stroke-width="1" fill="none"/>
    <rect x="10" y="25" width="4" height="5" fill="#000000"/>
    <rect x="18" y="25" width="4" height="5" fill="#000000"/>
  </g>

  <!-- ==================== ROW 2: BOW LEFT ==================== -->
  <!-- Col 0: Equip Left -->
  <g transform="translate(0, 64)">
    <polygon points="14,4 18,4 21,9 12,9" fill="#000000"/>
    <rect x="11" y="9" width="12" height="6" fill="#000000"/>
    <rect x="10" y="15" width="8" height="4" fill="#14141a"/>
    <rect x="11" y="16" width="2" height="2" fill="#DE2626"/>
    <rect x="10" y="19" width="12" height="7" fill="#000000"/>
    <path d="M6,12 Q4,18 6,24" stroke="#DE2626" stroke-width="2" fill="none"/>
    <rect x="11" y="26" width="4" height="4" fill="#000000"/>
    <rect x="17" y="26" width="5" height="4" fill="#000000"/>
  </g>

  <!-- Col 1: Nock Left -->
  <g transform="translate(32, 64)">
    <polygon points="13,4 17,4 20,9 11,9" fill="#000000"/>
    <rect x="10" y="9" width="12" height="6" fill="#000000"/>
    <rect x="9" y="15" width="8" height="4" fill="#14141a"/>
    <rect x="10" y="16" width="2" height="2" fill="#DE2626"/>
    <rect x="9" y="19" width="12" height="7" fill="#000000"/>
    <path d="M8,10 Q4,18 8,26" stroke="#DE2626" stroke-width="2" fill="none"/>
    <line x1="8" y1="10" x2="8" y2="26" stroke="#FFFFFF" stroke-width="0.8"/>
    <!-- Arrow nocked horizontal left -->
    <line x1="16" y1="18" x2="5" y2="18" stroke="#000000" stroke-width="1.5"/>
    <polygon points="3,18 6,16 6,20" fill="#FFFFFF"/>
    <rect x="10" y="26" width="4" height="4" fill="#000000"/>
    <rect x="16" y="26" width="5" height="4" fill="#000000"/>
  </g>

  <!-- Col 2: Full Draw Tension Left (Deep Draw) -->
  <g transform="translate(64, 64)">
    <polygon points="12,5 16,5 19,10 10,10" fill="#000000"/>
    <rect x="9" y="10" width="12" height="6" fill="#000000"/>
    <rect x="8" y="16" width="8" height="4" fill="#14141a"/>
    <rect x="9" y="17" width="2" height="2" fill="#DE2626"/>
    <rect x="8" y="20" width="12" height="6" fill="#000000"/>
    <!-- Bow deeply flexed left -->
    <path d="M6,10 Q2,18 6,26" stroke="#DE2626" stroke-width="2.5" fill="none"/>
    <polyline points="6,10 18,18 6,26" stroke="#FFFFFF" stroke-width="1" fill="none"/>
    <line x1="18" y1="18" x2="3" y2="18" stroke="#000000" stroke-width="1.5"/>
    <polygon points="1,18 4,15 4,21" fill="#FFFFFF"/>
    <circle cx="2" cy="18" r="1.5" fill="#DE2626"/>
    <rect x="8" y="26" width="5" height="4" fill="#000000"/>
    <rect x="16" y="25" width="4" height="5" fill="#000000"/>
  </g>

  <!-- Col 3: Release Left -->
  <g transform="translate(96, 64)">
    <polygon points="13,4 17,4 20,9 11,9" fill="#000000"/>
    <rect x="10" y="9" width="12" height="6" fill="#000000"/>
    <rect x="9" y="15" width="8" height="4" fill="#14141a"/>
    <rect x="10" y="16" width="2" height="2" fill="#DE2626"/>
    <rect x="9" y="19" width="12" height="7" fill="#000000"/>
    <path d="M6,10 Q4,18 6,26" stroke="#DE2626" stroke-width="2" fill="none"/>
    <line x1="6" y1="10" x2="6" y2="26" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Muzzle burst -->
    <circle cx="2" cy="18" r="3" stroke="#DE2626" stroke-width="1" fill="none"/>
    <line x1="0" y1="18" x2="-4" y2="18" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="10" y="26" width="4" height="4" fill="#000000"/>
    <rect x="16" y="26" width="4" height="4" fill="#000000"/>
  </g>

  <!-- ==================== ROW 3: BOW RIGHT ==================== -->
  <!-- Col 0: Equip Right -->
  <g transform="translate(0, 96)">
    <polygon points="15,4 19,4 21,9 12,9" fill="#000000"/>
    <rect x="10" y="9" width="12" height="6" fill="#000000"/>
    <rect x="15" y="15" width="8" height="4" fill="#14141a"/>
    <rect x="20" y="16" width="2" height="2" fill="#DE2626"/>
    <rect x="11" y="19" width="12" height="7" fill="#000000"/>
    <path d="M26,12 Q28,18 26,24" stroke="#DE2626" stroke-width="2" fill="none"/>
    <rect x="11" y="26" width="5" height="4" fill="#000000"/>
    <rect x="18" y="26" width="4" height="4" fill="#000000"/>
  </g>

  <!-- Col 1: Nock Right -->
  <g transform="translate(32, 96)">
    <polygon points="15,4 19,4 21,9 12,9" fill="#000000"/>
    <rect x="10" y="9" width="12" height="6" fill="#000000"/>
    <rect x="15" y="15" width="8" height="4" fill="#14141a"/>
    <rect x="20" y="16" width="2" height="2" fill="#DE2626"/>
    <rect x="11" y="19" width="12" height="7" fill="#000000"/>
    <path d="M24,10 Q28,18 24,26" stroke="#DE2626" stroke-width="2" fill="none"/>
    <line x1="24" y1="10" x2="24" y2="26" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="16" y1="18" x2="27" y2="18" stroke="#000000" stroke-width="1.5"/>
    <polygon points="29,18 26,16 26,20" fill="#FFFFFF"/>
    <rect x="11" y="26" width="5" height="4" fill="#000000"/>
    <rect x="18" y="26" width="4" height="4" fill="#000000"/>
  </g>

  <!-- Col 2: Full Draw Tension Right -->
  <g transform="translate(64, 96)">
    <polygon points="16,5 20,5 22,10 13,10" fill="#000000"/>
    <rect x="11" y="10" width="12" height="6" fill="#000000"/>
    <rect x="16" y="16" width="8" height="4" fill="#14141a"/>
    <rect x="21" y="17" width="2" height="2" fill="#DE2626"/>
    <rect x="12" y="20" width="12" height="6" fill="#000000"/>
    <!-- Bow deeply flexed right -->
    <path d="M26,10 Q30,18 26,26" stroke="#DE2626" stroke-width="2.5" fill="none"/>
    <polyline points="26,10 14,18 26,26" stroke="#FFFFFF" stroke-width="1" fill="none"/>
    <line x1="14" y1="18" x2="29" y2="18" stroke="#000000" stroke-width="1.5"/>
    <polygon points="31,18 28,15 28,21" fill="#FFFFFF"/>
    <circle cx="30" cy="18" r="1.5" fill="#DE2626"/>
    <rect x="12" y="25" width="4" height="5" fill="#000000"/>
    <rect x="19" y="26" width="5" height="4" fill="#000000"/>
  </g>

  <!-- Col 3: Release Right -->
  <g transform="translate(96, 96)">
    <polygon points="15,4 19,4 21,9 12,9" fill="#000000"/>
    <rect x="10" y="9" width="12" height="6" fill="#000000"/>
    <rect x="15" y="15" width="8" height="4" fill="#14141a"/>
    <rect x="20" y="16" width="2" height="2" fill="#DE2626"/>
    <rect x="11" y="19" width="12" height="7" fill="#000000"/>
    <path d="M26,10 Q28,18 26,26" stroke="#DE2626" stroke-width="2" fill="none"/>
    <line x1="26" y1="10" x2="26" y2="26" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Muzzle burst -->
    <circle cx="30" cy="18" r="3" stroke="#DE2626" stroke-width="1" fill="none"/>
    <line x1="32" y1="18" x2="36" y2="18" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="12" y="26" width="4" height="4" fill="#000000"/>
    <rect x="18" y="26" width="4" height="4" fill="#000000"/>
  </g>
</svg>