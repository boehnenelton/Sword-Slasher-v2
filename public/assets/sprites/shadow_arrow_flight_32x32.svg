<svg width="128" height="32" viewBox="0 0 128 32" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated;shape-rendering:crispEdges;">
  <rect width="128" height="32" fill="none"/>

  <!-- Col 0: Arrow Flight Down -->
  <g transform="translate(0, 0)">
    <!-- Particle wake trail -->
    <line x1="16" y1="2" x2="16" y2="10" stroke="#DE2626" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="15" cy="5" r="1" fill="#DE2626"/>
    <circle cx="17" cy="8" r="1" fill="#FFFFFF"/>
    <!-- Arrow body -->
    <line x1="16" y1="10" x2="16" y2="24" stroke="#000000" stroke-width="2"/>
    <!-- Fletching -->
    <polygon points="16,10 13,6 16,8" fill="#DE2626"/>
    <polygon points="16,10 19,6 16,8" fill="#DE2626"/>
    <!-- Arrowhead -->
    <polygon points="16,28 12,23 20,23" fill="#FFFFFF"/>
    <polygon points="16,28 14,24 18,24" fill="#DE2626"/>
  </g>

  <!-- Col 1: Arrow Flight Up -->
  <g transform="translate(32, 0)">
    <line x1="16" y1="30" x2="16" y2="22" stroke="#DE2626" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="15" cy="27" r="1" fill="#DE2626"/>
    <circle cx="17" cy="24" r="1" fill="#FFFFFF"/>
    <line x1="16" y1="22" x2="16" y2="8" stroke="#000000" stroke-width="2"/>
    <polygon points="16,22 13,26 16,24" fill="#DE2626"/>
    <polygon points="16,22 19,26 16,24" fill="#DE2626"/>
    <polygon points="16,4 12,9 20,9" fill="#FFFFFF"/>
    <polygon points="16,4 14,8 18,8" fill="#DE2626"/>
  </g>

  <!-- Col 2: Arrow Flight Left -->
  <g transform="translate(64, 0)">
    <line x1="30" y1="16" x2="22" y2="16" stroke="#DE2626" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="27" cy="15" r="1" fill="#DE2626"/>
    <circle cx="24" cy="17" r="1" fill="#FFFFFF"/>
    <line x1="22" y1="16" x2="8" y2="16" stroke="#000000" stroke-width="2"/>
    <polygon points="22,16 26,13 24,16" fill="#DE2626"/>
    <polygon points="22,16 26,19 24,16" fill="#DE2626"/>
    <polygon points="4,16 9,12 9,20" fill="#FFFFFF"/>
    <polygon points="4,16 8,14 8,18" fill="#DE2626"/>
  </g>

  <!-- Col 3: Arrow Flight Right -->
  <g transform="translate(96, 0)">
    <line x1="2" y1="16" x2="10" y2="16" stroke="#DE2626" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="5" cy="15" r="1" fill="#DE2626"/>
    <circle cx="8" cy="17" r="1" fill="#FFFFFF"/>
    <line x1="10" y1="16" x2="24" y2="16" stroke="#000000" stroke-width="2"/>
    <polygon points="10,16 6,13 8,16" fill="#DE2626"/>
    <polygon points="10,16 6,19 8,16" fill="#DE2626"/>
    <polygon points="28,16 23,12 23,20" fill="#FFFFFF"/>
    <polygon points="28,16 24,14 24,18" fill="#DE2626"/>
  </g>
</svg>