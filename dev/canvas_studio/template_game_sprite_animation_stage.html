<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Stage — Game Sprite Animation Stage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    body.theme-light {
      background: #FFFFFF;
      color: #000000;
    }
    body.theme-transparent {
      background: transparent !important;
    }

    /* Fixed capture stage */
    #capture-stage {
      position: relative;
      width: 400px;
      height: 400px;
      background: #000000;
      border: 1px solid #1c1c24;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 16px;
    }
    body.theme-light #capture-stage {
      background: #FFFFFF;
      border-color: #E2E2E8;
    }
    body.theme-transparent #capture-stage {
      background: transparent !important;
      border-color: transparent !important;
    }

    /* Viewport area for active frame */
    #viewport-container {
      position: relative;
      width: 256px;
      height: 256px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      background: rgba(18, 18, 24, 0.5);
    }
    body.theme-light #viewport-container {
      background: rgba(240, 240, 245, 0.5);
      border-color: rgba(0, 0, 0, 0.2);
    }

    /* Crosshairs & Bounding Box Guides */
    .crosshair-h {
      position: absolute;
      width: 100%;
      height: 1px;
      background: rgba(222, 38, 38, 0.4);
      top: 50%;
      pointer-events: none;
    }
    .crosshair-v {
      position: absolute;
      width: 1px;
      height: 100%;
      background: rgba(222, 38, 38, 0.4);
      left: 50%;
      pointer-events: none;
    }
    .bounding-box {
      position: absolute;
      width: 64px;
      height: 64px;
      border: 1px solid #DE2626;
      pointer-events: none;
    }

    /* Active Sprite Slot */
    #sprite-frame-slot {
      position: relative;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(var(--zoom-scale, 2));
      transform-origin: center;
    }

    /* Onion Skinning Ghost Layer */
    #onion-skin-slot {
      position: absolute;
      width: 64px;
      height: 64px;
      opacity: 0.25;
      pointer-events: none;
      display: none;
      transform: scale(var(--zoom-scale, 2));
      transform-origin: center;
    }
    #onion-skin-slot.active {
      display: flex;
    }

    /* Timeline Frame Strip */
    #timeline-strip {
      width: 100%;
      display: flex;
      gap: 8px;
      justify-content: center;
      background: rgba(10, 10, 14, 0.8);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #22222a;
    }
    .frame-pill {
      flex: 1;
      height: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #14141a;
      border: 1px solid #2d2d38;
      border-radius: 4px;
      font-size: 9px;
      font-family: monospace;
      color: #888899;
      cursor: pointer;
    }
    .frame-pill.active {
      background: #DE2626;
      border-color: #f87171;
      color: #FFFFFF;
      font-weight: bold;
    }

    /* Minimal studio toolbar */
    #studio-bar {
      position: fixed;
      top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid #22222a;
      padding: 6px 14px;
      border-radius: 6px;
      z-index: 100;
    }
    body.ui-hide #studio-bar {
      display: none;
    }
    .bar-btn {
      background: #181820;
      border: 1px solid #333340;
      color: #FFFFFF;
      font-size: 11px;
      font-family: monospace;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 4px;
    }
    .bar-btn.active {
      background: #DE2626;
      border-color: #f87171;
    }
    .bar-info {
      font-size: 11px;
      font-family: monospace;
      color: #888899;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="studio-bar">
    <span style="color:#DE2626; font-weight:bold; font-size:12px; font-family:monospace;">ANIM_STAGE</span>
    <button class="bar-btn" id="btn-play" onclick="togglePlay()">PLAY</button>
    <button class="bar-btn active" id="btn-zoom-2" onclick="setZoom(2)">2x</button>
    <button class="bar-btn" id="btn-zoom-4" onclick="setZoom(4)">4x</button>
    <button class="bar-btn" id="btn-zoom-8" onclick="setZoom(8)">8x</button>
    <button class="bar-btn" id="btn-onion" onclick="toggleOnionSkin()">ONION: OFF</button>
    <button class="bar-btn" id="btn-theme" onclick="toggleTheme()">THEME</button>
    <span class="bar-info" id="bar-status">FPS: 12 | FRAME 1/4</span>
  </div>

  <div id="capture-stage">
    <div id="viewport-container">
      <div class="crosshair-h"></div>
      <div class="crosshair-v"></div>
      <div class="bounding-box"></div>
      <div id="onion-skin-slot"></div>
      <div id="sprite-frame-slot"></div>
    </div>

    <div id="timeline-strip">
      <div class="frame-pill active" id="pill-0" onclick="setFrame(0)">FRAME 1</div>
      <div class="frame-pill" id="pill-1" onclick="setFrame(1)">FRAME 2</div>
      <div class="frame-pill" id="pill-2" onclick="setFrame(2)">FRAME 3</div>
      <div class="frame-pill" id="pill-3" onclick="setFrame(3)">FRAME 4</div>
    </div>
  </div>

  <script>
    window.isReadyToCapture = false;

    const params = new URLSearchParams(window.location.search);
    const bgParam = params.get('bg') || 'dark';
    const uiParam = params.get('ui') || 'show';
    const fpsParam = parseInt(params.get('fps') || '12', 10);
    const totalFrames = parseInt(params.get('frames') || '4', 10);

    let currentFrame = 0;
    let isPlaying = false;
    let playTimer = null;
    let onionSkinActive = false;
    let zoomScale = 2;

    if (bgParam === 'light') document.body.classList.add('theme-light');
    if (bgParam === 'transparent') document.body.classList.add('theme-transparent');
    if (uiParam === 'hide') document.body.classList.add('ui-hide');

    function setFrame(idx) {
      const prevFrame = currentFrame;
      currentFrame = idx % totalFrames;

      document.querySelectorAll('.frame-pill').forEach((p, i) => {
        p.classList.toggle('active', i === currentFrame);
      });

      const frameSlot = document.getElementById('sprite-frame-slot');
      const onionSlot = document.getElementById('onion-skin-slot');

      if (onionSkinActive) {
        onionSlot.innerHTML = `<span style="font-size:8px; font-family:monospace; color:#888;">GHOST_${prevFrame+1}</span>`;
      }

      frameSlot.innerHTML = `<span style="font-size:9px; font-family:monospace; color:#FFF; font-weight:bold;">FRAME_${currentFrame+1}</span>`;
      document.getElementById('bar-status').textContent = `FPS: ${fpsParam} | FRAME ${currentFrame+1}/${totalFrames}`;
    }

    function setZoom(scale) {
      zoomScale = scale;
      document.documentElement.style.setProperty('--zoom-scale', scale);
      ['2', '4', '8'].forEach(s => {
        document.getElementById(`btn-zoom-${s}`)?.classList.remove('active');
      });
      document.getElementById(`btn-zoom-${scale}`)?.classList.add('active');
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('btn-play');
      btn.textContent = isPlaying ? 'PAUSE' : 'PLAY';
      btn.classList.toggle('active', isPlaying);

      if (isPlaying) {
        playTimer = setInterval(() => {
          setFrame((currentFrame + 1) % totalFrames);
        }, 1000 / fpsParam);
      } else {
        clearInterval(playTimer);
        playTimer = null;
      }
    }

    function toggleOnionSkin() {
      onionSkinActive = !onionSkinActive;
      const btn = document.getElementById('btn-onion');
      btn.textContent = `ONION: ${onionSkinActive ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', onionSkinActive);
      document.getElementById('onion-skin-slot').classList.toggle('active', onionSkinActive);
    }

    function toggleTheme() {
      if (document.body.classList.contains('theme-light')) {
        document.body.classList.remove('theme-light');
        document.body.classList.add('theme-transparent');
      } else if (document.body.classList.contains('theme-transparent')) {
        document.body.classList.remove('theme-transparent');
      } else {
        document.body.classList.add('theme-light');
      }
    }

    // Playwright Automation API
    window.setFrame = setFrame;
    window.setZoom = setZoom;
    window.pauseAnimation = function() {
      if (isPlaying) togglePlay();
    };
    window.playAnimation = function() {
      if (!isPlaying) togglePlay();
    };
    window.seekProgress = function(ratio) {
      const targetFrame = Math.floor(ratio * (totalFrames - 1));
      setFrame(targetFrame);
    };

    setFrame(0);
    setZoom(2);
    window.isReadyToCapture = true;
  </script>
</body>
</html>
