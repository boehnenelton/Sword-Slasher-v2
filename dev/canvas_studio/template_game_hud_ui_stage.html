<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Stage — Game HUD & UI Stage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    body.theme-light {
      background: #FFFFFF;
      color: #000000;
    }
    body.theme-transparent {
      background: transparent !important;
    }

    /* Fixed capture stage */
    #capture-stage {
      position: relative;
      width: 640px;
      height: 480px;
      background: #000000;
      border: 1px solid #1c1c24;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 12px;
    }
    body.theme-light #capture-stage {
      background: #FFFFFF;
      border-color: #E2E2E8;
    }
    body.theme-transparent #capture-stage {
      background: transparent !important;
      border-color: transparent !important;
    }

    /* Top HUD Bar */
    .hud-row-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .hud-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Health containers */
    .heart-slot {
      width: 20px;
      height: 20px;
      border: 1px solid #DE2626;
      background: rgba(222, 38, 38, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-family: monospace;
      color: #DE2626;
      cursor: pointer;
      pointer-events: auto;
    }

    /* Magic gauge */
    .gauge-container {
      width: 90px;
      height: 14px;
      border: 1px solid #3b82f6;
      background: rgba(59, 130, 246, 0.1);
      display: flex;
      align-items: center;
      padding: 1px;
      cursor: pointer;
      pointer-events: auto;
    }
    .gauge-fill {
      width: 60%;
      height: 100%;
      background: #3b82f6;
    }
    .gauge-label {
      position: absolute;
      font-size: 7px;
      font-family: monospace;
      color: #FFFFFF;
      padding-left: 4px;
    }

    /* Active item boxes */
    .item-box {
      width: 36px;
      height: 36px;
      border: 1.5px solid #DE2626;
      background: #101015;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-family: monospace;
      color: #FFFFFF;
      cursor: pointer;
      pointer-events: auto;
    }
    .item-box-key {
      font-size: 7px;
      color: #DE2626;
      font-weight: bold;
    }

    /* Center game arena placeholder */
    .arena-placeholder {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      margin: 8px 0;
      color: rgba(255, 255, 255, 0.2);
      font-size: 10px;
      font-family: monospace;
      letter-spacing: 2px;
      pointer-events: none;
    }

    /* Bottom HUD Virtual Controls Deck */
    .hud-row-bottom {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }
    .joystick-placeholder {
      width: 72px;
      height: 72px;
      border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-family: monospace;
      color: #888899;
      cursor: pointer;
      pointer-events: auto;
    }
    .action-deck-placeholder {
      display: grid;
      grid-template-columns: repeat(2, 32px);
      gap: 6px;
      cursor: pointer;
      pointer-events: auto;
    }
    .action-btn-placeholder {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-family: monospace;
      color: #FFFFFF;
      background: #141418;
    }
    .action-btn-placeholder.accent {
      border-color: #DE2626;
      color: #DE2626;
    }

    /* Dialog Box Letterbox Slot */
    #dialog-box-slot {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      height: 64px;
      border: 1.5px solid #FFFFFF;
      background: rgba(0, 0, 0, 0.9);
      padding: 8px 12px;
      display: none;
      font-size: 9px;
      font-family: monospace;
      color: #FFFFFF;
      line-height: 1.4;
      pointer-events: auto;
    }
    #dialog-box-slot.active {
      display: block;
    }

    /* Isolated element container */
    #isolated-element {
      position: absolute;
      top: -9999px;
      left: -9999px;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.mode-isolated #capture-stage {
      display: none;
    }
    body.mode-isolated #isolated-element {
      position: relative;
      top: 0;
      left: 0;
      border: 1px solid #DE2626;
      box-shadow: 0 0 16px rgba(222, 38, 38, 0.5);
    }

    /* Minimal studio toolbar */
    #studio-bar {
      position: fixed;
      top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid #22222a;
      padding: 6px 14px;
      border-radius: 6px;
      z-index: 100;
    }
    body.ui-hide #studio-bar {
      display: none;
    }
    .bar-btn {
      background: #181820;
      border: 1px solid #333340;
      color: #FFFFFF;
      font-size: 11px;
      font-family: monospace;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 4px;
    }
    .bar-btn.active {
      background: #DE2626;
      border-color: #f87171;
    }
    .bar-info {
      font-size: 11px;
      font-family: monospace;
      color: #888899;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="studio-bar">
    <span style="color:#DE2626; font-weight:bold; font-size:12px; font-family:monospace;">HUD_STAGE</span>
    <button class="bar-btn" id="btn-dialog" onclick="toggleDialog()">DIALOG: OFF</button>
    <button class="bar-btn" id="btn-iso-item" onclick="isolateElement('.item-box')">ISO: ITEM</button>
    <button class="bar-btn" id="btn-iso-heart" onclick="isolateElement('.heart-slot')">ISO: HEART</button>
    <button class="bar-btn" id="btn-reset" onclick="resetStage()">STAGE</button>
    <button class="bar-btn" id="btn-theme" onclick="toggleTheme()">THEME</button>
    <span class="bar-info">640x480 | GAME_HUD</span>
  </div>

  <div id="capture-stage">
    <!-- Top HUD Row -->
    <div class="hud-row-top">
      <div class="hud-group">
        <div class="heart-slot">H1</div>
        <div class="heart-slot">H2</div>
        <div class="heart-slot">H3</div>
        <div class="heart-slot">H4</div>
        <div class="gauge-container" style="position:relative;">
          <div class="gauge-fill"></div>
          <span class="gauge-label">MP: 60%</span>
        </div>
      </div>
      <div class="hud-group">
        <div class="item-box">
          <span class="item-box-key">B</span>
          <span>SWD</span>
        </div>
        <div class="item-box">
          <span class="item-box-key">Y</span>
          <span>ITM</span>
        </div>
      </div>
    </div>

    <!-- Arena Placeholder -->
    <div class="arena-placeholder">GAMEPLAY_CANVAS_VIEWPORT</div>

    <!-- Bottom Controls Row -->
    <div class="hud-row-bottom">
      <div class="joystick-placeholder">JOYSTICK</div>
      <div class="action-deck-placeholder">
        <div class="action-btn-placeholder">X</div>
        <div class="action-btn-placeholder">Y</div>
        <div class="action-btn-placeholder accent">B</div>
        <div class="action-btn-placeholder">A</div>
      </div>
    </div>

    <!-- Dialog Letterbox -->
    <div id="dialog-box-slot">
      <span style="color:#DE2626; font-weight:bold;">SPEAKER_NAME</span><br>
      <span>[LITERAL_DIALOGUE_LINE_1_PLACEHOLDER]</span><br>
      <span style="color:#888899;">[LITERAL_DIALOGUE_LINE_2_PLACEHOLDER]</span>
    </div>
  </div>

  <div id="isolated-element"></div>

  <script>
    window.isReadyToCapture = false;

    const params = new URLSearchParams(window.location.search);
    const bgParam = params.get('bg') || 'dark';
    const uiParam = params.get('ui') || 'show';
    const dialogParam = params.get('dialog') === 'on';

    if (bgParam === 'light') document.body.classList.add('theme-light');
    if (bgParam === 'transparent') document.body.classList.add('theme-transparent');
    if (uiParam === 'hide') document.body.classList.add('ui-hide');
    if (dialogParam) document.getElementById('dialog-box-slot').classList.add('active');

    function toggleDialog() {
      const el = document.getElementById('dialog-box-slot');
      const active = el.classList.toggle('active');
      const btn = document.getElementById('btn-dialog');
      btn.textContent = `DIALOG: ${active ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', active);
    }

    function toggleTheme() {
      if (document.body.classList.contains('theme-light')) {
        document.body.classList.remove('theme-light');
        document.body.classList.add('theme-transparent');
      } else if (document.body.classList.contains('theme-transparent')) {
        document.body.classList.remove('theme-transparent');
      } else {
        document.body.classList.add('theme-light');
      }
    }

    function isolateElement(selector) {
      const target = document.querySelector(selector);
      if (!target) return;

      const rect = target.getBoundingClientRect();
      const iso = document.getElementById('isolated-element');
      iso.style.width = `${Math.ceil(rect.width)}px`;
      iso.style.height = `${Math.ceil(rect.height)}px`;
      iso.innerHTML = target.outerHTML;

      document.body.classList.add('mode-isolated');
    }

    function resetStage() {
      document.body.classList.remove('mode-isolated');
    }

    // Playwright Automation API
    window.isolateElement = isolateElement;
    window.resetStage = resetStage;
    window.toggleDialog = toggleDialog;
    window.setMode = function(mode) {
      document.body.classList.toggle('mode-isolated', mode === 'isolated');
    };

    window.isReadyToCapture = true;
  </script>
</body>
</html>
